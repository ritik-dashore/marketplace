services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: market-place
      MYSQL_USER: market-place
      MYSQL_PASSWORD: market-place_password
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "market-place", "-pmarket-place_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: node src/api.js
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: market-place
      DB_PASSWORD: market-place_password
      DB_NAME: market-place
      REDIS_URL: redis://redis:6379
      PICK_LOCK_TTL_SECONDS: ${PICK_LOCK_TTL_SECONDS:-900}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: node src/worker.js
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: market-place
      DB_PASSWORD: market-place_password
      DB_NAME: market-place
      REDIS_URL: redis://redis:6379
      MARKETPLACE_URL: ${MARKETPLACE_URL:-http://host.docker.internal:4000}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysqldata:
